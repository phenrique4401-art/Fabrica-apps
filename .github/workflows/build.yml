name: Fabrica de Apps APK e AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome do App'
        required: true
        default: 'MeuApp'
      package_id:
        description: 'ID do Pacote'
        required: true
        default: 'com.fabrica.meuapp'
      code_type:
        description: 'Tipo de Codigo'
        required: true
        default: 'html'
      build_format:
        description: 'Formato'
        required: true
        default: 'apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      
        

      - name: Montar App Web (HTML)
        if: github.event.inputs.code_type == 'html'
        run: |
          mkdir -p app_web/www
          cp codigo_usuario.txt app_web/www/index.html
          cd app_web
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_id }}" --web-dir=www
          npx cap add android
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_format }}" == "aab" ]; then
            ./gradlew bundleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Configurar Flutter
        if: github.event.inputs.code_type == 'dart'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Montar App Flutter (Dart)
        if: github.event.inputs.code_type == 'dart'
        run: |
          flutter create --org $(echo "${{ github.event.inputs.package_id }}" | rev | cut -d'.' -f2- | rev) --project-name app_flutter app_flutter
          cp codigo_usuario.txt app_flutter/lib/main.dart
          cd app_flutter
          flutter pub add flutter_tts audioplayers shared_preferences http || true
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          if [ "${{ github.event.inputs.build_format }}" == "aab" ]; then
            flutter build appbundle --release
          else
            flutter build apk --debug
          fi

      - name: Salvar APK ou AAB gerado
        uses: actions/upload-artifact@v4
        with:
          name: App-Pronto-${{ github.event.inputs.app_name }}
          path: |
            app_web/android/app/build/outputs/apk/debug/*.apk
            app_web/android/app/build/outputs/bundle/release/*.aab
            app_flutter/build/app/outputs/flutter-apk/*.apk
            app_flutter/build/app/outputs/bundle/release/*.aab
