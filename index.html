<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Fábrica de Apps</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { font-size: 22px; margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 12px 0 6px; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    textarea { height: 220px; font-family: monospace; resize: vertical; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; padding: 15px; margin-top: 18px; border: none; border-radius: 12px; background: #22c55e; color: #052e16; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; color: #94a3b8; }
    .status { margin-top: 16px; padding: 14px; border-radius: 10px; background: #0f172a; font-size: 14px; text-align: center; display: none; }
    .btn-link { display: inline-block; margin-top: 10px; padding: 10px 16px; background: #38bdf8; color: #0f172a; text-decoration: none; border-radius: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛠️ Minha Fábrica de Apps</h1>

    <label>🔑 Sua Chave Secreta do GitHub (Token ghp_...)</label>
    <input type="password" id="token" placeholder="Cole sua chave ghp_... aqui (fica salva só no seu celular)">

    <div class="row">
      <div>
        <label>📱 Nome do App</label>
        <input type="text" id="appName" value="MeuJogo2D">
      </div>
      <div>
        <label>📦 ID do Pacote</label>
        <input type="text" id="packageId" value="com.fabrica.meujogo">
      </div>
    </div>

    <div class="row">
      <div>
        <label>💻 Linguagem do Código</label>
        <select id="codeType">
          <option value="html">HTML / CSS / JS (Web)</option>
          <option value="dart">Dart (Flutter)</option>
        </select>
      </div>
      <div>
        <label>📲 Formato de Saída</label>
        <select id="buildFormat">
          <option value="apk">.APK (Instalar no Celular)</option>
          <option value="aab">.AAB (Publicar na Play Store)</option>
        </select>
      </div>
    </div>

    <label>📝 Cole o Código do seu App aqui:</label>
    <textarea id="userCode" placeholder="Cole seu código HTML ou Dart completo aqui..."></textarea>

    <button id="btnGerar" onclick="gerarApp()">🚀 GERAR APLICATIVO AGORA</button>

    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const USER = "phenrique4401-art";
    const REPO = "Fabrica-apps";

    window.onload = () => {
      const savedToken = localStorage.getItem("gh_token");
      if (savedToken) document.getElementById("token").value = savedToken;
    };

    function mostrarStatus(msg, cor = "#38bdf8") {
      const box = document.getElementById("statusBox");
      box.style.display = "block";
      box.style.color = cor;
      box.innerHTML = msg;
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    async function gerarApp() {
      const token = document.getElementById("token").value.trim();
      const appName = document.getElementById("appName").value.trim() || "MeuApp";
      const packageId = document.getElementById("packageId").value.trim() || "com.fabrica.app";
      const codeType = document.getElementById("codeType").value;
      const buildFormat = document.getElementById("buildFormat").value;
      const code = document.getElementById("userCode").value;

      if (!token) return mostrarStatus("⚠️ Cole sua chave ghp_... no primeiro campo!", "#f87171");
      if (!code.trim()) return mostrarStatus("⚠️ Cole o código do seu app na caixa grande!", "#f87171");

      localStorage.setItem("gh_token", token);
      const btn = document.getElementById("btnGerar");
      btn.disabled = true;

      try {
        mostrarStatus("1/3 ⏳ Enviando seu código para a fábrica...");

        const fileUrl = `https://github.com{USER}/${REPO}/contents/codigo_usuario.txt`;
        let sha = null;
        const checkRes = await fetch(fileUrl, { headers: { Authorization: `token ${token}` } });
        if (checkRes.ok) {
          const data = await checkRes.json();
          sha = data.sha;
        }

        const uploadRes = await fetch(fileUrl, {
          method: "PUT",
          headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            message: "Atualizar codigo do app",
            content: utf8ToBase64(code),
            sha: sha
          })
        });

        if (!uploadRes.ok) throw new Error("Chave inválida ou erro ao enviar código.");

        mostrarStatus("2/3 ⚙️ Ligando o robô compilador na nuvem...");

        const dispatchRes = await fetch(`https://github.com{USER}/${REPO}/actions/workflows/build.yml/dispatches`, {
          method: "POST",
          headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({
            ref: "main",
            inputs: { app_name: appName, package_id: packageId, code_type: codeType, build_format: buildFormat }
          })
        });

        if (!dispatchRes.ok) throw new Error("Erro ao acionar o robô. Confira se build.yml foi salvo.");

        mostrarStatus(
          `3/3 🎉 <b>Pedido enviado com sucesso!</b><br><br>
          O robô está montando seu <b>.${buildFormat.toUpperCase()}</b> agora (leva cerca de 3 a 5 minutos).<br>
          Toque no botão abaixo para acompanhar e baixar quando ficar verde:<br>
          <a class="btn-link" href="https://github.com{USER}/${REPO}/actions" target="_blank">📥 Abrir Downloads na Fábrica</a>`,
          "#4ade80"
        );
      } catch (err) {
        mostrarStatus("❌ Erro: " + err.message, "#f87171");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
