
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Fábrica de Apps</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .card { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { text-align: center; font-size: 22px; color: #38bdf8; margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin: 14px 0 6px; }
    input, select, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; }
    textarea { height: 220px; font-family: monospace; resize: vertical; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button { width: 100%; background: #22c55e; color: #052e16; font-weight: 800; font-size: 16px; border: none; padding: 15px; border-radius: 12px; margin-top: 18px; cursor: pointer; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #status { margin-top: 16px; padding: 14px; border-radius: 10px; background: #0f172a; font-size: 14px; text-align: center; display: none; word-break: break-word; }
    .btn-link { display: inline-block; background: #38bdf8; color: #0f172a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛠️ Minha Fábrica de Apps</h1>

    <label>🔑 Sua Chave Secreta do GitHub (Token ghp_...)</label>
    <input type="password" id="token" placeholder="Cole sua chave ghp_... aqui (salva sozinha)">

    <div class="row">
      <div>
        <label>📱 Nome do App</label>
        <input type="text" id="appName" value="InglesFacil">
      </div>
      <div>
        <label>📦 ID do Pacote</label>
        <input type="text" id="packageId" value="com.fabrica.inglesfacil">
      </div>
    </div>

    <div class="row">
      <div>
        <label>💻 Linguagem do Código</label>
        <select id="codeType">
          <option value="html">HTML / CSS / JS (Web)</option>
          <option value="dart" selected>Dart (Flutter)</option>
        </select>
      </div>
      <div>
        <label>📲 Formato de Saída</label>
        <select id="buildFormat">
          <option value="apk">.APK (Instalar no Celular)</option>
          <option value="aab">.AAB (Publicar na Play Store)</option>
        </select>
      </div>
    </div>

    <label>📝 Cole o Código do seu App aqui:</label>
    <textarea id="userCode" placeholder="Cole aqui o código completo em HTML ou Dart..."></textarea>

    <button id="btnBuild" onclick="gerarApp()">🚀 GERAR APLICATIVO AGORA</button>
    <div id="status"></div>
  </div>

  <script>
  const API_BASE = "https://github.com" + USUARIO + "/" + REPO;

    


    const tokenInput = document.getElementById('token');
    if (localStorage.getItem('gh_token')) {
      tokenInput.value = localStorage.getItem('gh_token');
    }

    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    async function gerarApp() {
      const token = tokenInput.value.replace(/\s+/g, '');
      const appName = document.getElementById('appName').value.trim().replace(/\s+/g, '') || 'MeuApp';
      const packageId = document.getElementById('packageId').value.trim() || 'com.fabrica.meuapp';
      const codeType = document.getElementById('codeType').value;
      const buildFormat = document.getElementById('buildFormat').value;
      const userCode = document.getElementById('userCode').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btnBuild');

      if (!token) return alert("Cole a sua Chave Secreta (ghp_...) primeiro!");
      if (!userCode.trim()) return alert("Cole o código do seu aplicativo na caixa grande!");

      localStorage.setItem('gh_token', token);
      btn.disabled = true;
      status.style.display = "block";
      status.innerHTML = "⏳ 1/3 Conectando com a fábrica...";

      const authHeader = {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github.v3+json"
      };

      try {
        const fileUrl = API_BASE + "/contents/codigo_usuario.txt?t=" + Date.now();
        let sha = null;
        const getRes = await fetch(fileUrl, { method: "GET", headers: authHeader });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        } else if (getRes.status === 401) {
          throw new Error("Chave Secreta (Token) inválida ou expirada!");
        }

        status.innerHTML = "⏳ 2/3 Salvando código na nuvem...";
        const putUrl = API_BASE + "/contents/codigo_usuario.txt";
        const putBody = {
          message: "Novo build: " + appName,
          content: utf8ToBase64(userCode)
        };
        if (sha) putBody.sha = sha;

        const putRes = await fetch(putUrl, {
          method: "PUT",
          headers: authHeader,
          body: JSON.stringify(putBody)
        });
        if (!putRes.ok) {
          const errPut = await putRes.json();
          throw new Error("Erro ao salvar (" + putRes.status + "): " + (errPut.message || ""));
        }

        status.innerHTML = "⏳ 3/3 Ligando o robô compilador...";
        const dispatchUrl = API_BASE + "/actions/workflows/build.yml/dispatches";
        const dispRes = await fetch(dispatchUrl, {
          method: "POST",
          headers: authHeader,
          body: JSON.stringify({
            ref: "main",
            inputs: {
              app_name: appName,
              package_id: packageId,
              code_type: codeType,
              build_format: buildFormat
            }
          })
        });

        if (!dispRes.ok) {
          const errDisp = await dispRes.json();
          throw new Error("Erro ao ligar robô (" + dispRes.status + "): " + (errDisp.message || ""));
        }

        status.innerHTML = "✅ <b>3/3 Pedido enviado com sucesso!</b><br><br>O robô já está gerando seu <b>." + buildFormat.toUpperCase() + "</b> na nuvem (leva cerca de 3 a 5 minutos).<br><a class='btn-link' href='https://github.com" + USUARIO + "/" + REPO + "/actions' target='_blank'>📥 Abrir Downloads na Fábrica</a>";
      } catch (err) {
        status.innerHTML = "❌ <b>Erro:</b> " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
